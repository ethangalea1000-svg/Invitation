<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitation pour Amaranta</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(140deg,#f1ecff,#e8f2ff);font-family:'Nunito Sans',Arial,sans-serif;color:#30334a;display:flex;align-items:center;justify-content:center;padding:24px.card{width:min(740px,100%);background:#fff;border:1px solid #d8d8eb;border-radius:24px;padding:46px;box-shadow:0 20px 55px rgba(54,54,90,.14)}.eyebrow{text-align:center;text-transform:uppercase;letter-spacing:2px;font-size:12px;color:#77799a;margin-bottom:12px}h1{text-align:center;margin:0 0 30px;font-size:32px;color:#4b4d78}.hello{font-size:21px;font-weight:700}.text{font-size:18px;letter-spacing:.01em;line-height:1.7}.details{display:grid;gap:10px;margin:22px 0}.detail{padding:14px 16px;background:#f5f5fb;border-radius:13px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}.actions button{padding:14px 22px;border:0;border-radius:12px;background:#e7e5f8;color:#42456c;font-weight:700;cursor:pointer}.actions button:hover{background:#dcdaf2}.msg{text-align:center;margin-top:18px;min-height:22px;font-weight:600}
</style></head><body><main class="card"><div class="eyebrow">Une invitation personnelle</div><h1>Amaranta, tu es invitée !</h1><p class="hello">Salut Amaranta !</p><div class="text"><p>Je t’invite à venir passer l’après-midi à Saint-Rémy-de-Provence le <strong>dimanche 18 octobre</strong>.</p><div class="details"><div class="detail">🕑 <strong>14 h → 18 h</strong></div><div class="detail">📍 <strong>Chez moi, à Saint-Rémy-de-Provence</strong></div><div class="detail">🎲 <strong>Jeux, discussions et moment sympa ensemble</strong></div></div><p>J’espère que tu pourras venir !</p></div><div class="actions"><button onclick="answer('yes')">Je viens</button><button onclick="answer('no')">Je ne peux pas</button></div><div class="msg" id="msg"></div></main>
<script>
const API="https://invitation-api.ethan-galea1000.workers.dev",INVITE_ID="invitation_amaranta_2026";
async function answer(type){const bs=document.querySelectorAll("button");bs.forEach(b=>b.disabled=true);const m=document.getElementById("msg");m.textContent="Enregistrement de ta réponse…";try{const r=await fetch(API+"/api/invitations/"+encodeURIComponent(INVITE_ID)+"/responses",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({answer:type,name:"Amaranta",count:1,note:"",custom:""})});const j=await r.json();if(!r.ok)throw new Error(j.error||"Erreur");m.textContent=type==="yes"?"Merci Amaranta, ta réponse a bien été enregistrée.":"Merci Amaranta, j’ai bien enregistré ta réponse."}catch(e){m.textContent="Impossible d'enregistrer la réponse : "+e.message;bs.forEach(b=>b.disabled=false)}}
</script></body></html>
