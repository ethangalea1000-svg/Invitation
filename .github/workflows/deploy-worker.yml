name: Deploy Invitation Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer le mot de passe admin du Worker
        working-directory: worker
        env:
          ADMIN_PASSWORD: ${{ secrets.INVITATION_ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "Le secret INVITATION_ADMIN_PASSWORD est absent ou vide."
            exit 1
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD

      - name: Déployer le Worker Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: Préparer l’invitation de groupe modèle
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute invitation-db --remote --command "INSERT OR IGNORE INTO invitations (invite_id, owner_token_hash, data_json, created_at, updated_at) VALUES ('invitation_groupe_modele_2026', 'admin-password', '{\"inviteId\":\"invitation_groupe_modele_2026\",\"type\":\"custom\",\"title\":\"Invitation de groupe — Modèle\",\"message\":\"Tu es invité(e) à participer à cet événement avec le groupe. Merci d’indiquer ton nom et ta réponse.\",\"date\":\"\",\"time\":\"\",\"place\":\"\",\"details\":\"Les informations de cette invitation pourront être remplacées par celles de l’événement.\",\"host\":\"Ethan\",\"guestName\":\"\",\"contact\":\"\",\"rsvp\":true,\"theme\":\"midnight\",\"accent\":\"#756ff5\",\"textColor\":\"#ffffff\",\"font\":\"classic\",\"compact\":false,\"symbol\":\"✦\",\"subtitle\":\"Modèle\",\"image\":\"\",\"askGuests\":false,\"askNote\":false,\"customQuestion\":\"\"}', strftime('%s','now') * 1000, strftime('%s','now') * 1000);"
