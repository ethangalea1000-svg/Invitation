name: Deploy Invitation Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer le mot de passe admin du Worker
        working-directory: worker
        env:
          ADMIN_PASSWORD: ${{ secrets.INVITATION_ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "Le secret INVITATION_ADMIN_PASSWORD est absent ou vide."
            exit 1
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD

      - name: Déployer le Worker Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
