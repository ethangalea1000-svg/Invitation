<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitation pour Iris</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Libre+Baskerville:wght@400;700&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:radial-gradient(circle at top,#fff8e8,#e7d5ae);color:#3f3326;font-family:'Libre Baskerville',Georgia,serif;display:flex;justify-content:center;align-items:center.letter{position:relative;width:min(780px,100%);padding:58px 64px;background:#fbf1d8;border:1px solid #b99b63;box-shadow:0 20px 55px rgba(70,48,20,.25)}.letter:before{content:"";position:absolute;inset:13px;border:1px solid #cdb785;pointer-events:none}.ornament{text-align:center;font-size:28px;color:#876b3c;margin-bottom:18px}h1{text-align:center;font-weight:normal;font-size:30px;margin:0 0 34px;color:#5a4427font-family:font-family:'Cinzel',Georgia,serif;p{font-size:18px;line-height:1.9;margin:0 0 22px;text-align:justify}.actions{position:relative;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:34px}.actions button{font-family:Georgia,serif;font-size:15px;padding:12px 20px;border:1px solid #a98a52;background:#f5e7c5;color:#4a3924;cursor:pointer}.actions button:hover{background:#ead7ad}.msg{text-align:center;margin-top:16px;min-height:22px;font-style:italic}
</style></head><body><main class="letter"><div class="ornament">✦ ❦ ✦</div><h1>Une invitation pour Iris</h1><p>Très chère Iris,</p><p>Je t’invite à venir à Saint-Rémy-de-Provence le <strong>dimanche 18 octobre</strong>, de <strong>14 h à 18 h</strong>.</p><p>Quelques heures pour profiter de jeux, de discussions et d’un agréable moment ensemble.</p><p>Si tu peux te joindre à nous, ce sera un grand plaisir de te voir.</p><div class="actions"><button onclick="answer('yes')">Oui, je serai présente ✨</button><button onclick="answer('no')">Je ne pourrai pas</button></div><div class="msg" id="msg"></div></main>
<script>
const API="https://invitation-api.ethan-galea1000.workers.dev",INVITE_ID="invitation_iris_2026";
async function answer(type){const bs=document.querySelectorAll("button");bs.forEach(b=>b.disabled=true);const m=document.getElementById("msg");m.textContent="Enregistrement de ta réponse…";try{const r=await fetch(API+"/api/invitations/"+encodeURIComponent(INVITE_ID)+"/responses",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({answer:type,name:"Iris",count:1,note:"",custom:""})});const j=await r.json();if(!r.ok)throw new Error(j.error||"Erreur");m.textContent=type==="yes"?"Merci Iris, ta réponse a bien été enregistrée.":"Merci Iris, j’ai bien enregistré ta réponse."}catch(e){m.textContent="Impossible d'enregistrer la réponse : "+e.message;bs.forEach(b=>b.disabled=false)}}
</script></body></html>
