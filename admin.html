<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Invitations</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#eef2f7;font-family:Inter,Arial,sans-serif;padding:20px}.wrap{max-width:1050px;margin:auto}.panel{background:#151b23;border:1px solid #293241;border-radius:18px;padding:20px;margin-bottom:18px}h1{margin:0 0 8px;font-size:28px}h2{font-size:19px;margin:0}.hint,p{color:#aab4c3;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{flex:1;min-width:240px;background:#0d1117;color:white;border:1px solid #354052;border-radius:10px;padding:12px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:#fff;color:#111}.secondary{background:#293241;color:#fff}.status{margin-top:12px;min-height:22px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{background:#0d1117;border:1px solid #293241;border-radius:12px;padding:13px}.stat b{display:block;font-size:22px}.stat span{color:#9eabbc;font-size:13px}.card{background:#0d1117;border:1px solid #293241;border-radius:15px;padding:16px;margin:12px 0}.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-weight:800;font-size:17px}.meta{color:#9eabbc;font-size:13px}.responses{margin-top:14px}.response{padding:11px 0;border-top:1px solid #293241}.yes{color:#72e0a4}.no{color:#ff9b9b}.empty{color:#8995a5;padding:8px 0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#293241;color:#dce3ec;font-size:12px}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}.cardhead{flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<div class="panel">
<h1>Administration des invitations</h1>
<p>Les réponses envoyées depuis les invitations sont enregistrées dans la base D1 et apparaissent ici.</p>
<div class="row"><input id="token" type="password" placeholder="Code organisateur"><button id="save">Enregistrer</button><button id="generate" class="secondary">Créer un code</button><button id="sync" class="secondary">Synchroniser les invitations</button><button id="refresh" class="secondary">Actualiser</button></div>
<div id="status" class="status"></div>
</div>
<div class="panel">
<div class="row" style="justify-content:space-between"><h2>Réponses reçues</h2><span id="last" class="meta"></span></div>
<div id="summary" class="summary"></div>
<div id="list"><p class="hint">Aucune donnée chargée.</p></div>
</div>
</div>
<script>
const API="https://invitation-api.ethan-galea1000.workers.dev";
const letters=[
{inviteId:"lettre_louise_2026",title:"Invitation pour Louise",message:"Invitation personnelle de Louise",date:"2026-08-19",time:"14:30",place:"Saint-Rémy-de-Provence",host:"Ethan",rsvp:true},
{inviteId:"lettre_laure_2026",title:"Invitation pour Laure",message:"Invitation de Laure",date:"2026-08-19",time:"14:30",place:"Saint-Rémy-de-Provence",host:"Ethan",rsvp:true},
{inviteId:"lettre_iris_2026",title:"Invitation pour Iris",message:"Invitation poétique de Iris",date:"2026-08-19",time:"14:30",place:"Saint-Rémy-de-Provence",host:"Ethan",rsvp:true},
{inviteId:"rappel_iris_2026",title:"Rappel pour Iris",message:"Rappel poétique",date:"2026-08-19",time:"14:30",place:"Saint-Rémy-de-Provence",host:"Ethan",rsvp:true},
{inviteId:"rappel_louna_2026",title:"Rappel de mission — Louna",message:"Rappel de la mission du 19 août",date:"2026-08-19",time:"14:30",place:"Saint-Rémy-de-Provence",host:"Ethan",rsvp:true}
];
let token=localStorage.getItem("invitationOrganizerToken")||"";
const $=id=>document.getElementById(id);
$("token").value=token;
function msg(t){$("status").textContent=t}
function newToken(){const a=new Uint8Array(24);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{"Content-Type":"application/json","X-Organizer-Token":token,...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Erreur serveur");return j}
$("save").onclick=()=>{token=$("token").value.trim();localStorage.setItem("invitationOrganizerToken",token);msg(token.length>=20?"Code enregistré.":"Le code semble trop court.");load()};
$("generate").onclick=()=>{token=newToken();$("token").value=token;localStorage.setItem("invitationOrganizerToken",token);msg("Nouveau code créé et enregistré.");load()};
$("sync").onclick=async()=>{if(!token){msg("Crée ou saisis d'abord un code.");return}try{for(const x of letters)await api("/api/invitations",{method:"POST",body:JSON.stringify({token,invitation:x})});msg("Les 5 invitations sont synchronisées.");load()}catch(e){msg(e.message)}};
$("refresh").onclick=load;
async function load(){
 if(!token){$("list").innerHTML="<p class='hint'>Code organisateur requis.</p>";$("summary").innerHTML="";return}
 $("list").innerHTML="<p class='hint'>Chargement des réponses…</p>";
 try{
  const j=await api("/api/invitations");
  const invs=j.invitations||[];
  const responses=invs.flatMap(i=>i.responses||[]);
  const yes=responses.filter(r=>r.answer==="yes").length;
  const no=responses.filter(r=>r.answer==="no").length;
  const people=responses.reduce((n,r)=>n+Math.max(1,Number(r.count)||1),0);
  $("summary").innerHTML='<div class="stat"><b>'+invs.length+'</b><span>Invitations</span></div><div class="stat"><b>'+responses.length+'</b><span>Réponses</span></div><div class="stat"><b>'+yes+'</b><span>Présents</span></div><div class="stat"><b>'+no+'</b><span>Absents</span></div>';
  if(!invs.length){$("list").innerHTML="<p class='hint'>Aucune invitation. Clique sur « Synchroniser les invitations ».</p>";return}
  $("list").innerHTML=invs.map(i=>{
   const rs=i.responses||[], y=rs.filter(r=>r.answer==="yes").length,n=rs.filter(r=>r.answer==="no").length;
   return '<div class="card"><div class="cardhead"><div><div class="title">'+esc(i.title||"Invitation")+'</div><div class="meta">'+esc(i.inviteId||"")+'</div></div><div class="pill">'+y+' présent'+(y>1?"s":"")+' · '+n+' absent'+(n>1?"s":"")+'</div></div><div class="responses">'+(rs.length?rs.map(r=>'<div class="response"><strong class="'+(r.answer==="yes"?"yes":"no")+'">'+(r.answer==="yes"?"Présent":"Absent")+'</strong> — '+esc(r.name||"Nom non indiqué")+' · '+(Math.max(1,Number(r.count)||1))+' personne'+(Math.max(1,Number(r.count)||1)>1?"s":"")+(r.note?' · '+esc(r.note):"")+(r.custom?' · '+esc(r.custom):"")+'<div class="meta">'+formatDate(r.createdAt||r.created_at)+'</div></div>').join(""):'<div class="empty">Aucune réponse pour cette invitation.</div>')+'</div></div>'
  }).join("");
  $("last").textContent="Actualisé à "+new Date().toLocaleTimeString("fr-FR");
 }catch(e){$("list").innerHTML="<p class='hint'>"+esc(e.message)+"</p>";$("summary").innerHTML=""}
}
function formatDate(v){if(!v)return"Date inconnue";const d=new Date(v);return Number.isNaN(d.getTime())?"Date inconnue":d.toLocaleString("fr-FR")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[c]))}
load();
</script></body></html>
